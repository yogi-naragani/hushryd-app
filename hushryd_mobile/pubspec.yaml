name: hushryd_mobile
description: "HushRyd - Ride Sharing Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.8.1
  # HTTP
  dio: ^5.7.0
  # Maps (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  # UI
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  pin_code_fields: ^8.0.1
  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
