<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Chase! - Tom & Jerry Style</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="intro">
  <div class="cats-preview">
    <svg class="preview-cat" viewBox="0 0 120 100" width="100" height="80">
      <polygon points="15,35 25,5 35,35" fill="#FF8C00" stroke="#333" stroke-width="2"/>
      <polygon points="85,35 95,5 105,35" fill="#FF8C00" stroke="#333" stroke-width="2"/>
      <ellipse cx="60" cy="55" rx="45" ry="35" fill="#FF8C00" stroke="#333" stroke-width="2"/>
      <ellipse cx="42" cy="48" rx="8" ry="10" fill="white"/>
      <ellipse cx="78" cy="48" rx="8" ry="10" fill="white"/>
      <ellipse cx="44" cy="49" rx="4" ry="6" fill="#222"/>
      <ellipse cx="80" cy="49" rx="4" ry="6" fill="#222"/>
      <ellipse cx="60" cy="60" rx="5" ry="3" fill="#FFB6C1"/>
      <line x1="10" y1="55" x2="35" y2="58" stroke="#333" stroke-width="1.5"/>
      <line x1="10" y1="62" x2="35" y2="62" stroke="#333" stroke-width="1.5"/>
      <line x1="85" y1="58" x2="110" y2="55" stroke="#333" stroke-width="1.5"/>
      <line x1="85" y1="62" x2="110" y2="62" stroke="#333" stroke-width="1.5"/>
      <path d="M55,66 Q60,72 65,66" stroke="#333" stroke-width="1.5" fill="none"/>
    </svg>
    <svg class="preview-cat" viewBox="0 0 120 100" width="100" height="80">
      <polygon points="15,35 25,5 35,35" fill="#444" stroke="#222" stroke-width="2"/>
      <polygon points="85,35 95,5 105,35" fill="#444" stroke="#222" stroke-width="2"/>
      <ellipse cx="60" cy="55" rx="45" ry="35" fill="#444" stroke="#222" stroke-width="2"/>
      <ellipse cx="42" cy="48" rx="8" ry="10" fill="#FFFFAA"/>
      <ellipse cx="78" cy="48" rx="8" ry="10" fill="#FFFFAA"/>
      <ellipse cx="44" cy="49" rx="4" ry="6" fill="#222"/>
      <ellipse cx="80" cy="49" rx="4" ry="6" fill="#222"/>
      <ellipse cx="60" cy="60" rx="5" ry="3" fill="#FFB6C1"/>
      <line x1="10" y1="55" x2="35" y2="58" stroke="#888" stroke-width="1.5"/>
      <line x1="10" y1="62" x2="35" y2="62" stroke="#888" stroke-width="1.5"/>
      <line x1="85" y1="58" x2="110" y2="55" stroke="#888" stroke-width="1.5"/>
      <line x1="85" y1="62" x2="110" y2="62" stroke="#888" stroke-width="1.5"/>
      <path d="M55,66 Q60,72 65,66" stroke="#888" stroke-width="1.5" fill="none"/>
    </svg>
    <svg class="preview-cat" viewBox="0 0 120 100" width="100" height="80">
      <polygon points="15,35 25,5 35,35" fill="#C0C0C0" stroke="#333" stroke-width="2"/>
      <polygon points="85,35 95,5 105,35" fill="#C0C0C0" stroke="#333" stroke-width="2"/>
      <ellipse cx="60" cy="55" rx="45" ry="35" fill="#C0C0C0" stroke="#333" stroke-width="2"/>
      <ellipse cx="42" cy="48" rx="8" ry="10" fill="#AAFFAA"/>
      <ellipse cx="78" cy="48" rx="8" ry="10" fill="#AAFFAA"/>
      <ellipse cx="44" cy="49" rx="4" ry="6" fill="#222"/>
      <ellipse cx="80" cy="49" rx="4" ry="6" fill="#222"/>
      <ellipse cx="60" cy="60" rx="5" ry="3" fill="#FFB6C1"/>
      <line x1="10" y1="55" x2="35" y2="58" stroke="#999" stroke-width="1.5"/>
      <line x1="10" y1="62" x2="35" y2="62" stroke="#999" stroke-width="1.5"/>
      <line x1="85" y1="58" x2="110" y2="55" stroke="#999" stroke-width="1.5"/>
      <line x1="85" y1="62" x2="110" y2="62" stroke="#999" stroke-width="1.5"/>
      <path d="M55,66 Q60,72 65,66" stroke="#999" stroke-width="1.5" fill="none"/>
    </svg>
  </div>
  <h1>Cat Chase!</h1>
  <p>Click the cats - watch them FREAK OUT and run!</p>
  <button onclick="startGame()">Play!</button>
</div>

<div id="game-area">
  <div id="score-board">Score: <span id="score">0</span></div>
  <div id="ground"></div>
</div>

<script src="audio.js"></script>
<script src="cats.js"></script>
<script src="game.js"></script>
</body>
</html>
